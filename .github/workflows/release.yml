name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release DMG
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Universal 2 DMG Installer
        run: |
          chmod +x scripts/build-app.sh scripts/build-dmg.sh
          ./scripts/build-dmg.sh --universal

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Syntly-*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
